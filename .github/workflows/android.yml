name: Build APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check Worker
        run: npx tsc -p worker/tsconfig.json

      # Public client config comes from the committed .env.production.
      - name: Build web app
        run: npm run build

      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decode signing key
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SNAPPER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
        env:
          KEYSTORE_B64: ${{ secrets.SNAPPER_KEYSTORE_B64 }}

      - name: Build signed APK
        working-directory: android
        run: bash ./gradlew assembleRelease --no-daemon
        env:
          SNAPPER_KEYSTORE_PASSWORD: ${{ secrets.SNAPPER_KEYSTORE_PASSWORD }}
          SNAPPER_KEY_ALIAS: ${{ secrets.SNAPPER_KEY_ALIAS }}
          SNAPPER_KEY_PASSWORD: ${{ secrets.SNAPPER_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: snapper-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
